name: ci
on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        config: [Release, Debug]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DRAVEL_SHARED=ON -DRAVEL_WERROR=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.config }}
      - name: Test
        # The golden RNG-stream and trace-digest tests fail if any platform
        # disagrees with the others about what a seed produces.
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined, thread]
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: |
          cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build-san
      - name: Test
        run: ctest --test-dir build-san --output-on-failure

  warnings:
    # The build job above uses each OS's default compiler; this adds the other
    # compiler on Linux, with warnings as errors.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build-w -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DRAVEL_WERROR=ON
      - name: Build
        run: cmake --build build-w

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang-tidy cppcheck
      - name: Configure
        run: cmake -S . -B build-sa -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_CXX_COMPILER=clang++
      - name: clang-tidy
        # The library and its public headers; .clang-tidy lists what is off and why.
        run: clang-tidy -p build-sa --quiet src/*.cpp
      - name: cppcheck
        # Style and portability findings are errors too. Suppressions live in
        # .cppcheck-suppressions with a reason each.
        run: |
          cppcheck --std=c++20 --enable=warning,style,performance,portability             --inline-suppr --suppressions-list=.cppcheck-suppressions             --error-exitcode=1 --quiet -I include src

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install gcovr
        run: pip install gcovr
      - name: Configure
        run: cmake -S . -B build-cov -DCMAKE_BUILD_TYPE=Debug -DRAVEL_COVERAGE=ON
      - name: Build
        run: cmake --build build-cov
      - name: Test
        run: ctest --test-dir build-cov --output-on-failure
      - name: Report
        # Only the library counts: tests, examples and benches would inflate it.
        run: |
          mkdir coverage
          gcovr --root . --filter 'src/' --filter 'include/ravel/' \
            --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
            --print-summary --txt coverage/summary.txt \
            --html-details coverage/index.html --json-summary coverage/summary.json
          cat coverage/summary.txt
          # Branches that only exist for exceptions and unreachable code drown
          # out the real ones; this view leaves them out.
          gcovr --root . --filter 'src/' --filter 'include/ravel/'             --gcov-ignore-parse-errors=negative_hits.warn_once_per_file             --exclude-throw-branches --exclude-unreachable-branches             --txt-metric branch --txt coverage/branches.txt             --json-summary coverage/branch-summary.json
          cat coverage/branches.txt
      - name: Check the coverage floor
        # Raise the floor when coverage improves; never lower it to make CI pass.
        env:
          RAVEL_LINE_COVERAGE_FLOOR: "97.0"
          RAVEL_BRANCH_COVERAGE_FLOOR: "92.0"  # Without exception-only branches.
        run: |
          python - <<'PY'
          import json, os, sys
          summary = json.load(open("coverage/summary.json"))
          floor = float(os.environ["RAVEL_LINE_COVERAGE_FLOOR"])
          actual = summary["line_percent"]
          print(f"line coverage {actual}% (floor {floor}%)")
          branch = json.load(open("coverage/branch-summary.json"))["branch_percent"]
          branch_floor = float(os.environ["RAVEL_BRANCH_COVERAGE_FLOOR"])
          print(f"branch coverage {branch}% (floor {branch_floor}%)")
          sys.exit(0 if actual >= floor and branch >= branch_floor else 1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage

  fuzz-smoke:
    # A minute per target: enough to catch a fresh regression, not to find a deep
    # bug. For hours, start the "fuzz" workflow by hand.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [read_choices, sweep_args]
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ \
            -DRAVEL_FUZZ=ON -DRAVEL_BUILD_TESTS=OFF -DRAVEL_BUILD_BENCH=OFF -DRAVEL_BUILD_EXAMPLES=OFF
          cmake --build build-fuzz --target fuzz_${{ matrix.target }}
      - name: Fuzz
        # Works on a copy so the committed corpus stays as it is.
        run: |
          cp -r fuzz/corpus/${{ matrix.target }} work-corpus
          build-fuzz/fuzz/fuzz_${{ matrix.target }} -max_total_time=60 -timeout=10 \
            -rss_limit_mb=2048 -artifact_prefix=crash- work-corpus
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: crash-*
