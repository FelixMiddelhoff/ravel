name: soak
# Long runs of ravel's own checks (replay, determinism, the disk reference
# model). Too slow for every push: start it by hand before a release.
on:
  workflow_dispatch:
    inputs:
      seeds:
        description: Seeds per system
        default: "20000"
      disk_sequences:
        description: Random disk operation sequences compared with the reference model
        default: "1000000"
      stress:
        description: Repetition multiplier for the thread-pool stress tests (TSan)
        default: "20"
      sanitized_seeds:
        description: Seeds per system for the ASan+UBSan soak (much slower per seed)
        default: "2000"

jobs:
  soak:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target ravel_soak
      - name: Soak
        shell: bash
        run: |
          exe=$(find build -type f \( -name ravel_soak -o -name ravel_soak.exe \) | head -1)
          threads=$(python3 -c "import os; print(os.cpu_count() or 1)" 2>/dev/null || python -c "import os; print(os.cpu_count() or 1)")
          "$exe" "${{ inputs.seeds }}" "$threads" "${{ inputs.disk_sequences }}"

  # The runner and shrinker threads under ThreadSanitizer, repeated many times.
  stress-tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug             -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"
          cmake --build build-tsan --target ravel_tests
      - name: Stress
        run: RAVEL_STRESS=${{ inputs.stress }} build-tsan/tests/ravel_tests stress

  # One full soak, and the disk model, with the address and undefined-behavior checkers.
  soak-sanitized:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Release             -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build-asan --target ravel_soak
      - name: Soak
        run: build-asan/bench/ravel_soak ${{ inputs.sanitized_seeds }} 4 50000
