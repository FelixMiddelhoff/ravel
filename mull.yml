# Mutation testing with Mull (see tools/mutation.sh). Only the library is mutated.
# Not mutated: calls and constant initialisers (about 300 extra mutants and an hour
# more per run); assignment and call mutators that this Mull version does not know.
mutators:
  - cxx_arithmetic
  - cxx_comparison
  - cxx_boundary
  - cxx_logical
  - cxx_increment
  - cxx_bitwise
  - negate_mutator
timeout: 60000
includePaths:
  - '.*/src/.*'
excludePaths:
  - '.*/tests/.*'
  - '.*/usr/.*'
